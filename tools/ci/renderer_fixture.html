<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>crafter renderer fixture</title>
<style>
  html, body { margin: 0; background: #14120f; color: #f2e8d8;
               font: 12px/1.4 system-ui, sans-serif; }
  #frame { border: 0; display: block; }
  #tx { display: block; }
  #note { padding: 6px 10px; }
</style>
</head>
<body>
<!--
  THE WORST-CASE RENDERER FIXTURE.

  tools/ci/docker_smoke.sh runs with NO ANTHROPIC_API_KEY, so the seat in the
  CI replay plays scripted and emits no `say` at all: the smoke replay can
  never exercise the feed's narration path, the mission ribbon at full cap, or
  the endcard's failure vocabulary (the cogchemists 2026-08-24 scar). Nothing
  that merely plays that replay can draw this chrome.

  So this page LOADS THE SHIPPED dist/static-replay-viewer/index.html IN AN
  IFRAME and shims only the wasm entry's OUTPUT — it does not re-implement the
  drawing (the particle-worlds 2026-08-26 scar). It drives the real page's own
  CrafterChrome.frame()/event() entry points with a worst case:

    * a `say` filled to exactly MaxSayRunes (160) with 4-byte emoji,
    * all 22 checklist chips in BOTH states,
    * four zeroed vitals and a full inventory,
    * a deep-night wash, a kill beat and a fallback beat,
    * a `death` endcard AND a 22 OF 22 endcard,

  at several canvas widths INCLUDING 360 px, then transcribes every DOM text
  run the real page produced onto a canvas at its measured geometry, so
  `viewer_smoke.mjs --strict-text-bounds` has something to measure (the page's
  own board pixels are drawn in a Worker on an OffscreenCanvas, where the
  harness's canvas_text instrumentation sees nothing).
-->
<div id="note">crafter renderer fixture — driving the shipped chrome</div>
<iframe id="frame" width="960" height="540" src="./index.html"></iframe>
<canvas id="tx" width="960" height="540"></canvas>
<script>
(function () {
  'use strict';

  var WIDTHS = [960, 640, 360];
  var SAY = (function () {
    // Exactly 160 runes, with 4-byte emoji sitting on the boundary. The base
    // sentence is repeated before the slice so the worst case really is at
    // the cap, which is what the full-length assertion below catches.
    var base = 'stone ridge is five cells NE at (35,25); mining it then arming up with a stone sword before the zombies find me, water is south at (28,34) ';
    var runes = Array.from(base);
    while (runes.length < 158) runes = runes.concat(Array.from(base));
    return runes.slice(0, 158).join('') + '\uD83E\uDDE9\uD83D\uDD11';
  })();
  var ACHIEVEMENTS = ['collect_wood', 'place_table', 'eat_cow',
    'collect_sapling', 'collect_drink', 'make_wood_pickaxe',
    'make_wood_sword', 'place_plant', 'defeat_zombie', 'collect_stone',
    'place_stone', 'eat_plant', 'defeat_skeleton', 'make_stone_pickaxe',
    'make_stone_sword', 'wake_up', 'place_furnace', 'collect_coal',
    'collect_iron', 'make_iron_pickaxe', 'make_iron_sword',
    'collect_diamond'];

  function chips(all) {
    // Every chip in BOTH states: the first eleven lit, the rest locked —
    // unless `all`, which is the 22 OF 22 endcard.
    return ACHIEVEMENTS.map(function (id, i) {
      var on = all || i < 11;
      return { id: id, i: i, on: on, t: on ? 40 + i * 37 : -1 };
    });
  }

  function worstState(tick) {
    var view = ['..T..#####', '..T...####', '....@.###', '..U....##',
                '........#', '...Z.....', '.........', '..~~.....',
                '..~~~....'].map(function (row) {
      return (row + '.........').slice(0, 9);
    });
    var over = tick > 1200;
    return {
      t: tick, mt: 1344, mx: 1344, st: 0, sp: 1, pl: true, lp: true,
      sk: false, ff: false, en: true, mm: -1, bs: 1, pov: -1,
      ph: over ? 'gameover' : 'playing',
      lob: 0, regime: 'standard', game: 1, games: 1, turnTicks: 24,
      teams: { red: { lives: 22, prog: 22, held: 22, cov: 221344, own: false,
                      tags: 1180, cogs: 1, flag: 'home', carrier: -1 } },
      roster: [{ s: 0, name: 'crafter-homesteader', alias: 'Alpha',
                 team: 'red', policy: 'homesteader', kind: 'llm',
                 alive: true, lives: 0, carry: 22 }],
      cf: {
        count: over ? 22 : 11, of: 22, par: 8, score: 221344,
        chips: chips(over),
        // Four ZEROED vitals: the worst case the pulse animation and the
        // .tiny collapse have to survive.
        health: 0, food: 0, drink: 0, energy: 0, vitalMax: 9,
        inv: { wood: 9, stone: 9, coal: 9, iron: 9, diamond: 9, sapling: 9 },
        tools: { wood_pickaxe: true, stone_pickaxe: true, iron_pickaxe: true,
                 wood_sword: true, stone_sword: true, iron_sword: true },
        x: 30, y: 27, cell: 24, camera: 15, world: 64,
        facing: 'down', asleep: false,
        day: 5, night: true, turn: 41, turns: 56,
        tick: tick, ticks: 1344, seen: 1180, cells: 4096,
        mined: 31, placed: 7, crafted: 5, cows: 2, interrupts: 6,
        fallbacks: 1, deathCause: over ? 'none' : 'zombie',
        view: view
      },
      over: over ? {
        winner: 'red', draw: false, timeLimit: false,
        teams: { red: { lives: 22, prog: 22 } },
        endRule: 'allUnlocked', reason: 'complete',
        game: 1, games: 1, regime: 'standard',
        unlocked: 22, of: 22, par: 8, deathCause: 'none', day: 7,
        score: 221344
      } : undefined,
      beats: [
        { k: 'achievement', t: 40, i: 0, n: 1, of: 22, id: 'collect_wood' },
        { k: 'nightfall', t: 128, day: 1 },
        { k: 'daybreak', t: 192, day: 2 },
        { k: 'kill', t: 260, what: 'zombie', x: 31, y: 30 },
        { k: 'fallback', t: 500, i: 30, cause: 'timeout' },
        { k: 'death', t: 812, by: 'zombie', tick: 812 },
        { k: 'end', t: 900, unlocked: 12, of: 22, score: 120812,
          reason: 'complete', endRule: 'death' }
      ],
      events: []
    };
  }

  var EVENTS = [
    { k: 'achievement', t: 40, i: 0, n: 1, of: 22, id: 'collect_wood' },
    { k: 'plan', t: 42, n: 3, verbs: 'goto do do do make_stone_sword',
      truncated: true, dropped: 2, interrupted: 'hurt_by_zombie' },
    { k: 'collect', t: 44, what: 'wood', x: 30, y: 28, count: 3 },
    { k: 'craft', t: 46, what: 'stone_pickaxe' },
    { k: 'place', t: 48, what: 'table', x: 29, y: 26 },
    { k: 'drink', t: 50, drink: 9 },
    { k: 'eat', t: 52, what: 'cow', food: 9 },
    { k: 'hurt', t: 60, by: 'zombie', amount: 2, hp: 4, x: 31, y: 30 },
    { k: 'kill', t: 62, what: 'zombie', x: 31, y: 30 },
    { k: 'nightfall', t: 128, day: 1 },
    { k: 'daybreak', t: 192, day: 2 },
    { k: 'burn', t: 193, n: 3 },
    { k: 'sleep', t: 200, state: 'start' },
    { k: 'sleep', t: 260, state: 'end', energy: 9 },
    { k: 'starve', t: 300, which: 'food', hp: 3 },
    { k: 'spawn', t: 310, what: 'skeleton', x: 26, y: 24 },
    { k: 'fallback', t: 500, i: 30, cause: 'timeout' },
    { k: 'death', t: 812, by: 'zombie', tick: 812 },
    // The say is driven LAST on purpose: the shipped feed keeps only a few
    // rows, and the full-length assertion below reads the remark back out of
    // the row the shipped chrome actually built.
    { k: 'say', t: 42, text: SAY }
  ];

  // The fixture's own strings must come out of the shipped chrome UNSHORTENED.
  // Without this, a game block that quietly trimmed a remark before writing it
  // into a feed row would transcribe the short string, measure it, and pass —
  // leaving the fixture green while testing nothing (checklist item 15's last
  // bullet). Nothing here shrinks a string: it reads the transcribed runs back.
  function assertFullLength(runs, width) {
    [['the 160-rune say', SAY]]
      .forEach(function (entry) {
        var label = entry[0], want = entry[1];
        var carried = runs.some(function (text) { return text.indexOf(want) >= 0; });
        if (carried) return;
        var longest = runs.reduce(
          function (a, b) { return b.length > a.length ? b : a; }, '');
        throw new Error(label + ' came out of the shipped chrome shortened at ' +
          width + 'px: wanted ' + Array.from(want).length +
          ' runes, longest transcribed run was ' + Array.from(longest).length +
          ' runes');
      });
  }

  function fail(message) {
    document.documentElement.setAttribute('data-replay-error', message);
    var note = document.getElementById('note');
    if (note) note.textContent = 'FIXTURE FAILED: ' + message;
  }

  // Wrap `text` the way the DOM wraps it inside `width`, so a run the shipped
  // page lays out over several lines is transcribed as a block instead of as
  // one impossible line. Single-line runs (white-space: nowrap — every label
  // and nameplate here) keep the one-line treatment, which is where a string
  // with nowhere to go still shows up as a draw outside the canvas.
  function wrapText(ctx, text, width) {
    var words = text.split(/\s+/);
    var lines = [];
    var line = '';
    for (var i = 0; i < words.length; i++) {
      if (!words[i]) continue;
      var next = line ? line + ' ' + words[i] : words[i];
      if (line && ctx.measureText(next).width > width) {
        lines.push(line);
        line = words[i];
      } else {
        line = next;
      }
    }
    if (line) lines.push(line);
    return lines.length ? lines : [text];
  }

  // Transcribe the real page's DOM text runs onto our canvas at their measured
  // geometry, so --strict-text-bounds measures the SHIPPED strings.
  function transcribe(doc, canvas, runs) {
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var selectors = ['#clock-time', '#clock-caption', '#fpv-name', '#fpv-cap',
                     '#ec-headline', '#ec-how', '#ec-wincond',
                     '.plate-name', '.cf-alias', '#cf-vitals .cf-vname',
                     '#cf-inv .cf-res', '#cf-inv .cf-tool',
                     '#cf-checklist .cf-chip span',
                     '#killfeed .feed-row', '#tick-clock', '#zoom-read'];
    var drawn = 0;
    selectors.forEach(function (selector) {
      var nodes = doc.querySelectorAll(selector);
      for (var i = 0; i < nodes.length; i++) {
        var node = nodes[i];
        var text = (node.textContent || '').trim();
        if (!text) continue;
        var box = node.getBoundingClientRect();
        var style = doc.defaultView.getComputedStyle(node);
        var size = parseFloat(style.fontSize) || 12;
        ctx.font = size + 'px ' + (style.fontFamily || 'sans-serif');
        ctx.fillStyle = '#f2e8d8';
        ctx.textBaseline = 'top';
        // Clamp into the canvas the way the shipped layout clamps into the
        // board: a run that cannot fit is what --strict-text-bounds is for.
        var x = Math.max(0, Math.min(canvas.width - 4, box.left));
        var white = String(style.whiteSpace || '');
        var wraps = white.indexOf('nowrap') < 0 && white.indexOf('pre') !== 0;
        var lines = wraps
          ? wrapText(ctx, text, Math.max(24, Math.min(box.width || canvas.width,
                                                      canvas.width - x)))
          : [text];
        var lineHeight = size * 1.3;
        var block = lineHeight * lines.length;
        var y = Math.max(0, Math.min(canvas.height - block - 2, box.top));
        for (var line = 0; line < lines.length; line++) {
          ctx.fillText(lines[line], x, y + line * lineHeight);
        }
        runs.push(text);
        drawn++;
      }
    });
    return drawn;
  }

  var frame = document.getElementById('frame');
  var canvas = document.getElementById('tx');
  var deadline = Date.now() + 60000;

  function drive() {
    var win, doc;
    try {
      win = frame.contentWindow;
      doc = frame.contentDocument;
    } catch (e) {
      fail('cannot reach the shipped page: ' + e.message);
      return;
    }
    if (!win || !doc || !win.CrafterChrome || !win.CF_CTX) {
      if (Date.now() > deadline) {
        fail('the shipped page never exposed CrafterChrome');
        return;
      }
      setTimeout(drive, 200);
      return;
    }
    var total = 0;
    try {
      if (Array.from(SAY).length !== 160) {
        throw new Error('the fixture built a ' + Array.from(SAY).length +
                        '-rune say; MaxSayRunes is 160');
      }
      WIDTHS.forEach(function (width) {
        frame.width = String(width);
        frame.height = String(Math.round(width * 0.5625));
        canvas.width = width;
        canvas.height = Math.round(width * 0.5625);
        if (typeof win.dispatchEvent === 'function') {
          win.dispatchEvent(new win.Event('resize'));
        }
        // The shipped page publishes its own chrome context as CF_CTX, so
        // this fixture drives the REAL chrome through the REAL context.
        var ctx = win.CF_CTX;
        if (!ctx) throw new Error('the shipped page published no chrome context');
        [700, 1300].forEach(function (tick) {
          var state = worstState(tick);
          EVENTS.forEach(function (event) {
            try { win.CrafterChrome.event(event, state, ctx); }
            catch (e) { throw new Error('event ' + event.k + ': ' + e.message); }
          });
          try { win.CrafterChrome.frame(state, ctx, false); }
          catch (e) { throw new Error('frame: ' + e.message); }
        });
        // The 9x9 agent-view inset is a REQUIRED spectator readout, and the
        // inherited renderFpv() reveals #fpv only for a paintball POV seat —
        // a key this fork never sends, which left the panel computed every
        // frame and never displayed (review r1, N1). Probe the SHIPPED page's
        // computed style, at every width, so a regression back to
        // display:none is red here instead of invisible.
        var fpv = doc.getElementById('fpv');
        if (!fpv) throw new Error('the shipped page has no #fpv panel');
        if (win.getComputedStyle(fpv).display === 'none') {
          throw new Error('#fpv (the agent view 9x9 inset) is display:none at ' +
                          width + 'px after a frame that carries a view');
        }
        var runs = [];
        total += transcribe(doc, canvas, runs);
        assertFullLength(runs, width);
      });
    } catch (e) {
      fail(e.message);
      return;
    }
    if (total === 0) {
      fail('the shipped chrome produced no text to measure');
      return;
    }
    document.getElementById('note').textContent =
      'crafter renderer fixture — ' + total + ' shipped text runs measured at ' +
      WIDTHS.join('/') + ' px';
    document.documentElement.setAttribute('data-replay-loaded', 'true');
  }

  frame.addEventListener('load', function () { setTimeout(drive, 400); });
  setTimeout(drive, 1500);
})();
</script>
</body>
</html>
