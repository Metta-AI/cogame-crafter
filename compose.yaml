# ONE service, because the manifest image placeholder is DERIVED FROM THE
# COMPOSE SERVICE NAME (`service crafter` -> `{{CRAFTER_IMAGE}}`);
# `{{GAME_IMAGE}}` is not a thing (lantern 0.1.0). The image carries two
# entrypoints — /bin/crafter (the game) and /bin/crafter-player (the seat
# registrar) — because the shared tools/ci/docker_smoke.sh and
# tools/ci/policies.json assume a single image (the knights-archers precedent).
services:
  crafter:
    image: coworld-crafter:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      network: host
