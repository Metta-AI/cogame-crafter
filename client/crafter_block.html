<!-- ============================================================
     CRAFTER additions to the inherited coworld-ctf chrome
     ============================================================
     Everything above this banner is the starter's broadcast page, edited only
     by the enumerated list in tools/build_broadcast_page.py: the elements the
     design note removes (the POV badge, the hit-point pips, the gear line and
     the un-fogged tactical inset), the spectator vocabulary re-mapping table,
     and the CSS for beat kinds this game never emits.

     #viewpanel IS KEPT — zoom bar, minimap and all. The world is 64x64 cells
     (1536x1536 native px) and the default view shows 15 of them, so this board
     genuinely is larger than the frame, which is exactly the condition the pin
     names. The block arms a FOLLOW-CAM over it: core.setZoom(64 / cameraCells)
     once per board and core.panTo on every frame while follow is armed; any
     user pan disarms it and the starter's own resetView() re-arms it.

     Nothing here touches the transport band. relayout() still owns --hudscale,
     --topband and --band on :root; the endcard still stops above the band and
     is still dismissed by every seek; and every scrubber beat this block draws
     is a LABELLED, CLICKABLE BUTTON that seeks on click, styled for EVERY kind
     this sim emits — achievement, nightfall, daybreak, kill, death, fallback
     and end, and no others. The builder carries a cf- prefix precisely so it
     can never be shadowed by the chrome alias block's own hoisted declaration
     of the shared markBeat (cogame-tandem, 2026-08-23).
     ============================================================ -->
<style>
/* --- scorebug: the single plate ---------------------------------------- */
/* The plate name must survive a 360px featured-match iframe: it grows into
   whatever room the plate has and ellipsises only when it genuinely runs out,
   never collapsing to a bare "…". */
.plate-name {
  flex: 1 1 auto;
  min-width: 3.2em;
  overflow: hidden;
  text-overflow: ellipsis;
}
.plate .cf-alias {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--paper-dim);
  white-space: nowrap;
}
.plate .cf-fb { color: var(--amber); font-family: var(--pixfont); }

/* --- vitals: four bars of nine pips on the plate ----------------------- */
#cf-vitals {
  position: absolute;
  left: calc(8 * var(--u));
  top: calc(var(--topband, 0px) + 8 * var(--u));
  z-index: 5;
  display: flex;
  flex-direction: column;
  gap: calc(2 * var(--u));
  background: rgba(12, 10, 8, 0.66);
  padding: calc(4 * var(--u)) calc(6 * var(--u));
  pointer-events: none;
}
#cf-vitals .cf-vrow { display: flex; align-items: center; gap: calc(3 * var(--u)); }
#cf-vitals .cf-vname {
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--paper-dim);
  width: calc(30 * var(--u));
}
#cf-vitals .cf-pips { display: flex; gap: calc(1 * var(--u)); }
#cf-vitals .cf-pip {
  width: calc(4 * var(--u));
  height: calc(9 * var(--u));
  background: rgba(242, 232, 216, 0.16);
}
#cf-vitals .cf-vrow.health .cf-pip.on { background: var(--red); }
#cf-vitals .cf-vrow.food .cf-pip.on { background: #56ba6a; }
#cf-vitals .cf-vrow.drink .cf-pip.on { background: #4a80e0; }
#cf-vitals .cf-vrow.energy .cf-pip.on { background: #a060d0; }
#cf-vitals .cf-vrow.zero .cf-vname { color: var(--red); animation: cfpulse 1s ease-in-out infinite; }
@keyframes cfpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

/* --- inventory strip: six resources + six tool chips -------------------- */
#cf-inv {
  position: absolute;
  left: calc(8 * var(--u));
  top: calc(var(--topband, 0px) + 74 * var(--u));
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  gap: calc(3 * var(--u));
  max-width: calc(180 * var(--u));
  pointer-events: none;
}
#cf-inv .cf-res, #cf-inv .cf-tool {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  line-height: 1;
  padding: calc(2 * var(--u)) calc(4 * var(--u));
  background: rgba(12, 9, 6, 0.62);
  color: var(--paper-dim);
  white-space: nowrap;
}
#cf-inv .cf-res.have { color: var(--paper); }
#cf-inv .cf-tool { opacity: 0.3; }
#cf-inv .cf-tool.own { opacity: 1; color: var(--amber); }

/* --- the achievement checklist, in the LEFT gutter ---------------------- */
/* The single most important readout in this game, and why the checklist gets
   a whole gutter. Two columns x eleven rows, in canonical order, positioned
   inside the board region's letterbox gutter — never inside var(--band). */
#cf-checklist {
  position: absolute;
  /* THE LEFT GUTTER. A 360 x 203 embed letterboxes a square board to
     120 x 120 and leaves two ~120 px gutters; this game uses both — the
     checklist here, and #viewpanel's minimap above the 9x9 inset on the
     right. Anchored from --topband downward, so nothing ever enters the
     transport band. */
  left: calc(8 * var(--u));
  top: calc(var(--topband, 0px) + 108 * var(--u));
  z-index: 5;
  display: grid;
  grid-template-columns: repeat(2, auto);
  grid-auto-flow: column;
  grid-template-rows: repeat(11, auto);
  gap: calc(2 * var(--u)) calc(5 * var(--u));
  background: rgba(12, 10, 8, 0.6);
  padding: calc(4 * var(--u));
}
#cf-checklist .cf-chip {
  display: flex;
  align-items: center;
  gap: calc(3 * var(--u));
  opacity: 0.25;
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--paper);
  white-space: nowrap;
}
#cf-checklist .cf-chip i {
  width: calc(9 * var(--u));
  height: calc(9 * var(--u));
  flex: none;
  background: transparent;
  box-shadow: inset 0 0 0 calc(1 * var(--u)) rgba(242, 232, 216, 0.45);
}
#cf-checklist .cf-chip.on { opacity: 1; }
#cf-checklist .cf-chip.on i {
  background: var(--amber);
  box-shadow: inset 0 0 0 calc(1 * var(--u)) rgba(255, 244, 214, 0.9);
}
#cf-checklist .cf-chip.flash i { animation: cfflash 420ms steps(3) 2; }
@keyframes cfflash { 0%, 100% { background: var(--amber); } 50% { background: #fff6dc; } }

/* --- the cog's own 9x9 window, in the kept #fpv panel ------------------- */
/* The RIGHT gutter, directly beneath #viewpanel's minimap: the starter pins
   #fpv bottom-left, which is where this game's feed and checklist live. The
   panel keeps its own #fpv-grip drag/resize above 620 px. */
#fpv {
  left: auto !important;
  right: calc(12 * var(--u));
  bottom: auto !important;
  top: calc(var(--topband, 0px) + 208 * var(--u));
}
#fpv-cap { letter-spacing: 0.12em; }

/* --- scrubber beats: one rule per kind this sim emits, and no others ---- */
/* Buttons, not divs: each carries a title + aria-label and seeks on click. */
button.beat-marker {
  border: 0;
  padding: 0;
  cursor: pointer;
  appearance: none;
  background: var(--paper-dim);
  position: absolute;
  top: 0;
  width: calc(2 * var(--u));
  height: calc(10 * var(--u));
  transform: translateX(-1px);
  z-index: 2;
}
.beat-marker.achievement {
  background: var(--amber);
  width: calc(3 * var(--u));
  height: calc(12 * var(--u));
}
.beat-marker.nightfall { background: #2b3f88; height: calc(8 * var(--u)); }
.beat-marker.daybreak { background: #cfd6e6; height: calc(8 * var(--u)); }
.beat-marker.kill { background: #56ba6a; height: calc(9 * var(--u)); }
.beat-marker.death {
  background: var(--red);
  width: calc(3 * var(--u));
  height: calc(14 * var(--u));
}
.beat-marker.fallback {
  background: var(--paper-dim);
  height: calc(6 * var(--u));
  opacity: 0.8;
}
.beat-marker.end {
  background: var(--paper);
  width: calc(3 * var(--u));
  height: calc(14 * var(--u));
}

/* --- the endcard's five-column achievement table ------------------------ */
#endcard .ec-teams .ec-thead,
#endcard .ec-teams .ec-row {
  display: grid;
  grid-template-columns: 2.5em minmax(0, 1fr) 5.5em 4.5em 3.5em;
  gap: calc(8 * var(--u));
  align-items: baseline;
  text-align: left;
  width: 100%;
}
#endcard .ec-teams .ec-row > span:nth-child(2),
#endcard .ec-teams .ec-thead > span:nth-child(2) {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .ec-teams .ec-row > span:nth-child(n+3),
#endcard .ec-teams .ec-thead > span:nth-child(n+3) {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
#endcard .ec-teams .ec-row.locked { opacity: 0.42; }
#stage.tiny #endcard .ec-teams .ec-thead,
#stage.tiny #endcard .ec-teams .ec-row {
  grid-template-columns: 2em minmax(0, 1fr) 4em 3.5em 2.5em;
  gap: calc(4 * var(--u));
}

/* --- feed rows --------------------------------------------------------- */
.feed-row .cf-say { color: var(--paper); font-style: italic; }
.feed-row .cf-note { color: var(--amber); letter-spacing: 0.06em; }
/* The inherited row is `white-space: nowrap` and sized to content, which is
   right for a paintball kill line and wrong for a 160-rune remark: at 360 px
   such a row grows past the frame and the tail is drawn off-screen. Model-
   authored rows therefore WRAP inside the feed's own reserved width; every
   other row is single-line with an ellipsis and keeps its full text in
   `title`. */
.feed-row.cf-remark {
  white-space: normal;
  overflow-wrap: anywhere;
  max-width: 100%;
  line-height: 1.3;
  align-items: flex-start;
}
.feed-row.cf-line {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

/* --- legible at 360px -------------------------------------------------- */
/* relayout() toggles #stage.tiny at boardW <= 620 and clamps --hudscale to
   [0.5, 1.6]; both are the starter's, kept verbatim. These six rules are what
   this game adds on top, and tests/test_crafter_viewer.nim asserts each. */
/* 1. the plate keeps alias + name + achievement count + health bar */
#stage.tiny .plate .cf-alias {
  font-size: calc(7 * var(--u));
  letter-spacing: 0.08em;
  max-width: calc(120 * var(--u));
  overflow: hidden;
  text-overflow: ellipsis;
}
#stage.tiny #cf-vitals .cf-vrow.food,
#stage.tiny #cf-vitals .cf-vrow.drink,
#stage.tiny #cf-vitals .cf-vrow.energy { display: none; }
#stage.tiny #cf-vitals .cf-vname { display: none; }
#stage.tiny #cf-vitals .cf-pip { width: calc(3 * var(--u)); height: calc(6 * var(--u)); }
#stage.tiny #cf-strip { display: flex; }
/* 2. the inventory strip drops its resource numerals to 8 px icon-plus-count */
#stage.tiny #cf-inv {
  top: calc(var(--topband, 0px) + 30 * var(--u));
  max-width: calc(110 * var(--u));
  gap: calc(2 * var(--u));
}
#stage.tiny #cf-inv .cf-res, #stage.tiny #cf-inv .cf-tool {
  font-size: calc(8 * var(--u));
  padding: calc(1 * var(--u)) calc(2 * var(--u));
}
/* 3. the checklist renders as 2 x 11 nine-px icon chips with no captions */
#stage.tiny #cf-checklist {
  top: calc(var(--topband, 0px) + 60 * var(--u));
  gap: calc(1 * var(--u)) calc(2 * var(--u));
  padding: calc(2 * var(--u));
}
#stage.tiny #cf-checklist .cf-chip span { display: none; }
#stage.tiny #cf-checklist .cf-chip i { width: calc(9 * var(--u)); height: calc(9 * var(--u)); }
#stage.tiny #cf-checklist .cf-chip.on i { box-shadow: inset 0 0 0 1px var(--amber); }
/* 4. the zoom bar is hidden; #minimap pins to 56 px square at the top of the
      right gutter and the 9x9 inset to 56 px square beneath it
      (56 + 8 + 56 = 120 px, exactly the gutter height), and #fpv-grip is
      disabled so the inset can never be dragged over the board */
#stage.tiny #zoombar { display: none; }
#stage.tiny #minimap { width: 56px !important; height: 56px !important; }
#stage.tiny #viewpanel { gap: 8px; }
#stage.tiny #fpv {
  width: 56px !important;
  height: 56px !important;
  top: calc(var(--topband, 0px) + 64px);
}
#stage.tiny #fpv-grip { display: none; }
/* 5. the fog wash is a higher-contrast two-step and the night wash caps at
      55 % opacity: an 8 px cell cannot carry three wash levels and still show
      a zombie */
#stage.tiny #board { --cf-fogsteps: 2; --cf-nightcap: 0.55; }
/* 6. #killfeed shows three rows instead of six */
#stage.tiny #killfeed .feed-row:nth-child(n+4) { display: none; }
</style>
<script>
(function () {
  'use strict';
  // Every name here carries a cf- prefix ON PURPOSE. The page's chrome alias
  // block declares the shared beat builder with a hoisted `var markBeat`, so a
  // game-block function of that name is silently swallowed by it and the
  // scrubber ends up with unlabelled div markers that never seek
  // (cogame-tandem, 2026-08-23). tests/test_crafter_viewer.nim asserts the
  // whole alias list is untouched below this banner.
  var CTX = null;
  var cfPlaced = {};          // "tick|kind" -> true (dedup)
  var cfLit = {};             // achievement index -> true (flash once)
  var cfFollow = true;        // the follow-cam, armed at load
  var cfCameraCells = 15;
  var cfZoomApplied = false;
  var cfZoomTries = 0;
  var cfPanX = -1;
  var cfPanY = -1;

  var CF_GLYPH_COLOUR = {
    '.': '#3f6b34', ',': '#c0a463', '~': '#2a5fd0', '#': '#7b7770',
    '=': '#4a453d', 'T': '#2c5a2e', 'c': '#1a1816', 'i': '#b0743e',
    'D': '#78dce2', '!': '#e0662a', 'B': '#3a3733', 't': '#a8763c',
    'f': '#c8562a', 'p': '#5f9c4e', 'Y': '#d4543e', 'U': '#d8c8a8',
    'Z': '#6ab060', 'K': '#e6e2d4', '^': '#efe4c6', '@': '#d64a3e',
    '?': '#08080a'
  };

  var CF_NAME = {
    collect_wood: 'CHOP WOOD', place_table: 'PLACE TABLE',
    eat_cow: 'EAT A COW', collect_sapling: 'GET A SAPLING',
    collect_drink: 'DRINK', make_wood_pickaxe: 'WOOD PICKAXE',
    make_wood_sword: 'WOOD SWORD', place_plant: 'PLANT A SAPLING',
    defeat_zombie: 'BEAT A ZOMBIE', collect_stone: 'MINE STONE',
    place_stone: 'PLACE STONE', eat_plant: 'EAT A PLANT',
    defeat_skeleton: 'BEAT A SKELETON', make_stone_pickaxe: 'STONE PICKAXE',
    make_stone_sword: 'STONE SWORD', wake_up: 'WAKE UP RESTED',
    place_furnace: 'PLACE FURNACE', collect_coal: 'MINE COAL',
    collect_iron: 'MINE IRON', make_iron_pickaxe: 'IRON PICKAXE',
    make_iron_sword: 'IRON SWORD', collect_diamond: 'CUT A DIAMOND'
  };

  var CF_DEATH = {
    zombie: 'KILLED BY A ZOMBIE', skeleton: 'KILLED BY A SKELETON',
    arrow: 'SHOT BY AN ARROW', lava: 'WALKED INTO LAVA',
    starvation: 'STARVED', thirst: 'DIED OF THIRST',
    exhaustion: 'COLLAPSED FROM EXHAUSTION', none: ''
  };

  function cfEl(id) { return document.getElementById(id); }
  function cfUpper(text) { return String(text || '').toUpperCase(); }
  function cfLabel(id) { return CF_NAME[id] || cfUpper(String(id).replace(/_/g, ' ')); }

  function cfScrubGeometry(s) {
    var st = Math.max(0, s.st || 0);
    var mx = Math.max(st + 1, s.mx || 1);
    return { st: st, span: mx - st };
  }

  // A LABELLED, CLICKABLE BUTTON on the scrubber that seeks on click. Never
  // `markBeat` — see the prefix note above.
  function cfBeat(s, tick, kind, label) {
    var key = tick + '|' + kind;
    if (cfPlaced[key]) return;
    cfPlaced[key] = true;
    var scrub = cfEl('scrub');
    if (!scrub) return;
    var g = cfScrubGeometry(s);
    var el = document.createElement('button');
    el.type = 'button';
    el.className = 'beat-marker ' + kind;
    el.style.left =
      (Math.min(1, Math.max(0, (tick - g.st) / g.span)) * 100) + '%';
    el.title = label;
    el.setAttribute('aria-label', label);
    el.__tick = tick;
    el.addEventListener('click', function (ev) {
      ev.stopPropagation();
      CTX.send('s:' + tick);
    });
    scrub.appendChild(el);
  }

  function cfFeed(html, cls) {
    var row = document.createElement('div');
    row.className = 'feed-row ' + (cls || 'cf-line');
    row.innerHTML = html;
    CTX.pushFeed(row);
  }

  // ---- the follow-cam over the kept #viewpanel ---------------------------
  // fitScale and zoom are related by zoom = worldSize / cellsAcross
  // independently of the container width, so showing `cameraCells` cells is
  // exactly core.setZoom(64 / cameraCells). broadcast_core.js resets zoom to
  // minZoom whenever the board's native size changes — which happens once, at
  // the first frame — so this re-applies whenever it observes zoom === 1 with
  // follow still armed.
  function cfCamera(s, cf) {
    var core = window.CF_CORE;
    if (!core || !cf) return;
    var world = cf.world || 64;
    var cell = cf.cell || 24;
    if (!cfFollow) return;
    var t = core.getTransform ? core.getTransform() : null;
    // The transform lives a thread away (the board is drawn on an
    // OffscreenCanvas in a Worker), so `zoom === 1` may simply mean the
    // Worker has not echoed one back yet. Re-applying is cheap, but it is a
    // postMessage: cap the retries so a core that never reports a transform
    // costs a handful of messages rather than one per frame forever.
    if (!cfZoomApplied || (t && t.zoom === 1 && cfZoomTries < 30)) {
      cfZoomTries++;
      core.setZoom(world / cfCameraCells);
      cfZoomApplied = true;
    }
    // panTo posts a message to the Worker that owns the board, so it is sent
    // only when the cog actually moves — a per-frame message on a board this
    // size is a message queue the compositor never catches up with.
    var wantX = cf.x * cell + cell / 2;
    var wantY = cf.y * cell + cell / 2;
    if (wantX !== cfPanX || wantY !== cfPanY) {
      cfPanX = wantX;
      cfPanY = wantY;
      core.panTo(wantX, wantY);
    }
    var read = cfEl('zoom-read');
    if (read) {
      var across = cfCameraCells;
      if (t && t.zoom > 0) across = Math.round(world / t.zoom);
      across = Math.max(1, Math.min(world, across));
      var text = across + ' CELLS';
      if (read.textContent !== text) read.textContent = text;
    }
  }

  // ---- the vitals bars and the inventory strip ---------------------------
  function cfEnsure(id, host, html) {
    var el = cfEl(id);
    if (!el) {
      var parent = cfEl(host);
      if (!parent) return null;
      el = document.createElement('div');
      el.id = id;
      if (html) el.innerHTML = html;
      parent.appendChild(el);
    }
    return el;
  }

  var CF_VITALS = ['health', 'food', 'drink', 'energy'];

  function cfRenderVitals(cf) {
    var host = cfEnsure('cf-vitals', 'stage', '');
    if (!host) return;
    if (!host.childNodes.length) {
      CF_VITALS.forEach(function (name) {
        var row = document.createElement('div');
        row.className = 'cf-vrow ' + name;
        var label = document.createElement('span');
        label.className = 'cf-vname';
        label.textContent = name;
        var pips = document.createElement('span');
        pips.className = 'cf-pips';
        for (var i = 0; i < (cf.vitalMax || 9); i++) {
          var pip = document.createElement('i');
          pip.className = 'cf-pip';
          pips.appendChild(pip);
        }
        row.appendChild(label);
        row.appendChild(pips);
        host.appendChild(row);
      });
    }
    CF_VITALS.forEach(function (name, r) {
      var row = host.childNodes[r];
      if (!row) return;
      var value = cf[name] || 0;
      var cls = 'cf-vrow ' + name + (value === 0 ? ' zero' : '');
      if (row.className !== cls) row.className = cls;
      var pips = row.childNodes[1];
      for (var i = 0; i < pips.childNodes.length; i++) {
        var want = 'cf-pip' + (i < value ? ' on' : '');
        if (pips.childNodes[i].className !== want) {
          pips.childNodes[i].className = want;
        }
      }
    });
  }

  var CF_RES = ['wood', 'stone', 'coal', 'iron', 'diamond', 'sapling'];
  var CF_TOOLS = ['wood_pickaxe', 'stone_pickaxe', 'iron_pickaxe',
                  'wood_sword', 'stone_sword', 'iron_sword'];
  var CF_TOOL_SHORT = {
    wood_pickaxe: 'W-PICK', stone_pickaxe: 'S-PICK', iron_pickaxe: 'I-PICK',
    wood_sword: 'W-SWORD', stone_sword: 'S-SWORD', iron_sword: 'I-SWORD'
  };

  function cfRenderInventory(cf) {
    var host = cfEnsure('cf-inv', 'stage', '');
    if (!host || !cf.inv || !cf.tools) return;
    if (!host.childNodes.length) {
      CF_RES.forEach(function (name) {
        var chip = document.createElement('span');
        chip.className = 'cf-res';
        chip.title = name;
        host.appendChild(chip);
      });
      CF_TOOLS.forEach(function (name) {
        var chip = document.createElement('span');
        chip.className = 'cf-tool';
        chip.title = name.replace(/_/g, ' ');
        chip.textContent = CF_TOOL_SHORT[name];
        host.appendChild(chip);
      });
    }
    CF_RES.forEach(function (name, i) {
      var chip = host.childNodes[i];
      var count = cf.inv[name] || 0;
      var text = cfUpper(name.slice(0, 4)) + ' ' + count;
      if (chip.textContent !== text) chip.textContent = text;
      var cls = 'cf-res' + (count > 0 ? ' have' : '');
      if (chip.className !== cls) chip.className = cls;
    });
    CF_TOOLS.forEach(function (name, i) {
      var chip = host.childNodes[CF_RES.length + i];
      var cls = 'cf-tool' + (cf.tools[name] ? ' own' : '');
      if (chip.className !== cls) chip.className = cls;
    });
  }

  // ---- the achievement checklist ----------------------------------------
  function cfRenderChecklist(cf) {
    var host = cfEnsure('cf-checklist', 'stage', '');
    if (!host || !cf.chips) return;
    if (!host.childNodes.length) {
      cf.chips.forEach(function (chip) {
        var el = document.createElement('div');
        el.className = 'cf-chip';
        el.title = cfLabel(chip.id);
        el.innerHTML = '<i></i><span></span>';
        el.childNodes[1].textContent = cfLabel(chip.id);
        host.appendChild(el);
      });
    }
    cf.chips.forEach(function (chip, i) {
      var el = host.childNodes[i];
      if (!el) return;
      var flash = chip.on && !cfLit[i];
      if (chip.on) cfLit[i] = true;
      var cls = 'cf-chip' + (chip.on ? ' on' : '') + (flash ? ' flash' : '');
      if (el.className !== cls) el.className = cls;
    });
  }

  // ---- the cog's own 9x9 window, in the kept #fpv panel -------------------
  function cfRenderAgentView(s, cf) {
    var canvas = cfEl('fpv-canvas');
    if (!canvas || !cf || !cf.view || !cf.view.length) return;
    var box = canvas.parentNode;
    var size = Math.max(56, Math.min(box ? box.clientWidth : 120,
                                     box ? box.clientHeight : 120));
    var dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(size * dpr)) {
      canvas.width = Math.round(size * dpr);
      canvas.height = Math.round(size * dpr);
    }
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    var n = cf.view.length;
    var cell = Math.floor(size / n);
    var pad = Math.floor((size - cell * n) / 2);
    for (var j = 0; j < n; j++) {
      var row = cf.view[j];
      for (var i = 0; i < row.length; i++) {
        var ch = row.charAt(i);
        // Every glyph is drawn as a CHIP, never as text, so nothing this
        // panel draws can land outside the canvas at any --hudscale.
        ctx.fillStyle = CF_GLYPH_COLOUR[ch] || '#3f6b34';
        ctx.fillRect(pad + i * cell, pad + j * cell, cell - 1, cell - 1);
        if (ch === '@') {
          ctx.fillStyle = '#f2e8d8';
          ctx.fillRect(pad + i * cell + Math.floor(cell / 3),
                       pad + j * cell + 2,
                       Math.max(1, Math.floor(cell / 3)),
                       Math.max(1, Math.floor(cell / 3)));
        }
      }
    }
    var nameEl = cfEl('fpv-name');
    if (nameEl) {
      var text = 'ALPHA · FACING ' + cfUpper(cf.facing);
      if (nameEl.textContent !== text) nameEl.textContent = text;
    }
    // SHOW the panel. The inherited renderFpv() reveals #fpv only while a seat
    // is in the paintball POV lens (`s.pov >= 0 && s.fp`), and this fork sends
    // neither key, so it clears `on` on every frame and the window this game
    // exists to show stayed display:none. Here the 9x9 window is a REQUIRED
    // spectator readout, not an opt-in lens.
    var panel = cfEl('fpv');
    if (panel) panel.classList.add('on');
  }

  // ---- the scorebug plate ------------------------------------------------
  function cfRenderPlate(s, cf) {
    var plate = document.querySelector('.plate[data-team="red"]');
    if (!plate || !cf) return;
    var num = cfEl('lives-red');
    if (num) {
      var text = cf.count + '/' + cf.of;
      if (num.textContent !== text) num.textContent = text;
    }
    var chip = cfEl('hill-red');
    if (chip) {
      chip.className = 'hillchip cf-alias';
      var carry = 'DAY ' + cf.day + (cf.night ? ' · NIGHT' : '');
      if (chip.textContent !== carry) chip.textContent = carry;
      chip.title = cf.night ? 'Night — zombies are out' : 'Daylight';
    }
    var tags = cfEl('tags-red');
    if (tags) {
      tags.className = 'cf-alias';
      var sub = 'ALPHA · score ' + cf.score +
        (cf.fallbacks > 0 ? ' · ↯' + cf.fallbacks : '');
      if (tags.textContent !== sub) tags.textContent = sub;
    }
  }

  function cfRenderClock(s, cf) {
    if (!cf) return;
    var big = cfEl('clock-time');
    var cap = cfEl('clock-caption');
    if (s.ph === 'lobby') return;   // the shared chrome owns the lobby text
    if (big) {
      var text = 'DAY ' + cf.day + (cf.night ? ' · NIGHT' : ' · DAY');
      if (big.textContent !== text) big.textContent = text;
    }
    var numeral = cfEl('clock');
    if (numeral) numeral.setAttribute('data-cf', cf.count + ' / ' + cf.of);
    if (cap) {
      var line = 'tick ' + cf.tick + '/' + cf.ticks + ' · hp ' + cf.health +
        ' · score ' + cf.score;
      if (cap.textContent !== line) cap.textContent = line;
    }
  }

  function cfRenderEndcard(s, cf) {
    if (s.ph !== 'gameover' || !cf) return;
    var head = cfEl('ec-headline');
    if (head) {
      var how = CF_DEATH[cf.deathCause] || 'RAN OUT OF TURNS';
      head.textContent = cf.count + ' OF ' + cf.of + ' UNLOCKED — ' + how +
        (cf.deathCause && cf.deathCause !== 'none'
          ? ' ON DAY ' + cf.day : '');
    }
    var howEl = cfEl('ec-how');
    if (howEl) {
      howEl.textContent = 'survived ' + cf.tick + ' ticks across ' + cf.day +
        ' days, ' + cf.seen + ' of ' + cf.cells + ' cells seen, ' + cf.mined +
        ' blocks mined, ' + cf.placed + ' placed, ' + cf.crafted +
        ' items crafted, ' + cf.cows + ' cows eaten, ' + cf.interrupts +
        ' turns cut short, ' + cf.fallbacks + ' fallback turn' +
        (cf.fallbacks === 1 ? '' : 's') + ' · SCORE ' + cf.score;
    }
    var cond = cfEl('ec-wincond');
    if (cond && s.over) {
      cond.textContent = 'Ended ' + s.over.reason + ' (' + s.over.endRule +
        ') · par ' + cf.par;
    }
    // The transport's verdict chip is fed by the shared chrome from the
    // frame's team key, so it reads "RED WINS". There are no teams here:
    // re-label it for the ONE cog.
    var chip = cfEl('win-chip');
    if (chip) {
      var verdict = cf.count + '/' + cf.of + ' — PAR ' +
        (s.over && s.over.winner === 'red' ? 'MET' : 'MISSED');
      if (chip.textContent !== verdict) chip.textContent = verdict;
    }
    var teamsEl = cfEl('ec-teams');
    if (teamsEl && cf.chips) {
      var rows = '<div class="ec-thead"><span>#</span><span>Achievement</span>' +
        '<span>Unlocked</span><span>Tick</span><span>Day</span></div>';
      cf.chips.forEach(function (chip2, i) {
        var day = chip2.on && cf.ticks
          ? Math.floor(chip2.t / Math.max(1, cf.ticks / Math.max(1, cf.day))) + 1
          : '';
        rows += '<div class="ec-row' + (chip2.on ? '' : ' locked') +
          '"><span>' + (i + 1) + '</span><span>' +
          CTX.esc(cfLabel(chip2.id)) + '</span><span>' +
          (chip2.on ? 'yes' : '—') + '</span><span>' +
          (chip2.on ? chip2.t : '—') + '</span><span>' +
          (chip2.on ? day : '—') + '</span></div>';
      });
      if (teamsEl.getAttribute('data-cf') !== String(cf.count) + cf.score) {
        teamsEl.innerHTML = rows;
        teamsEl.setAttribute('data-cf', String(cf.count) + cf.score);
      }
    }
  }

  // ---- events ------------------------------------------------------------
  // Returns true when this block handled the event, so the inherited switch
  // never doubles it.
  function cfEvent(e, s, ctx) {
    // A harness (tools/ci/renderer_fixture.html) may drive these entry points
    // without a context, because the page's own PB_CTX lives inside the
    // chrome IIFE. install() already gave us one; never overwrite it with
    // undefined.
    if (ctx) CTX = ctx;
    switch (e.k) {
      case 'achievement':
        cfBeat(s, e.t, 'achievement',
          '★ Achievement ' + e.n + '/' + e.of + ' — ' + cfLabel(e.id) +
          ' — click to jump here');
        cfFeed('<span class="cf-note">★ ACHIEVEMENT ' + e.n + '/' + e.of +
          ' — ' + CTX.esc(cfLabel(e.id)) + '</span>');
        CTX.banner('★ ' + cfLabel(e.id) + ' — ' + e.n + '/' + e.of, 'amb');
        return true;
      case 'nightfall':
        cfBeat(s, e.t, 'nightfall',
          'Night falls on day ' + e.day + ' — click to jump here');
        cfFeed('NIGHT FALLS ON DAY ' + e.day);
        return true;
      case 'daybreak':
        cfBeat(s, e.t, 'daybreak',
          'Day ' + e.day + ' breaks — click to jump here');
        cfFeed('THE SUN COMES UP ON DAY ' + e.day);
        return true;
      case 'kill':
        cfBeat(s, e.t, 'kill',
          'Killed a ' + e.what + ' — click to jump here');
        cfFeed('KILLED A ' + cfUpper(e.what));
        return true;
      case 'death':
        cfBeat(s, e.t, 'death',
          (CF_DEATH[e.by] || 'Died') + ' — click to jump here');
        cfFeed('<span class="cf-note">ALPHA ' + cfUpper(CF_DEATH[e.by] ||
          'DIED') + '</span>');
        return true;
      case 'fallback':
        cfBeat(s, e.t, 'fallback',
          'Missed the call (' + e.cause + ') — click to jump here');
        cfFeed('MISSED THE CALL — forager plan (' + CTX.esc(e.cause) + ')');
        return true;
      case 'end':
        cfBeat(s, e.t, 'end',
          e.unlocked + ' of ' + e.of + ' unlocked — click to jump here');
        return false;    // the endcard is state-driven; let the page see it
      case 'say':
        cfFeed('<span class="who red">Alpha</span>' +
          '<span class="glyph">:</span><span class="cf-say">&ldquo;' +
          CTX.esc(e.text) + '&rdquo;</span>', 'cf-remark');
        return true;
      case 'plan':
        cfFeed('PLAN — ' + CTX.esc(e.verbs || '(noop)') +
          (e.truncated ? ' <span class="cf-note">CUT OFF</span>' : '') +
          (e.dropped ? ' <span class="cf-note">' + e.dropped +
            ' DROPPED</span>' : '') +
          (e.interrupted ? ' <span class="cf-note">TURN CUT SHORT — ' +
            cfUpper(String(e.interrupted).replace(/_/g, ' ')) + '</span>' : ''),
          'cf-remark');
        return true;
      case 'collect':
        cfFeed('COLLECTED ' + cfUpper(e.what) + ' (' + e.count + ')');
        return true;
      case 'craft':
        cfFeed('MADE A ' + cfUpper(String(e.what).replace(/_/g, ' ')));
        return true;
      case 'place':
        cfFeed('PLACED A ' + cfUpper(String(e.what).replace(/_/g, ' ')) +
          ' AT (' + e.x + ',' + e.y + ')');
        return true;
      case 'eat':
        cfFeed('ATE A ' + cfUpper(e.what) + ' (FOOD ' + e.food + '/9)');
        return true;
      case 'drink':
        cfFeed('DRANK FROM THE LAKE (' + e.drink + '/9)');
        return true;
      case 'hurt':
        cfFeed('A ' + cfUpper(e.by) + ' HIT ALPHA — ' + e.hp +
          ' HEALTH LEFT');
        return true;
      case 'heal':
        return true;      // a slow regeneration tick is not news
      case 'spawn':
        cfFeed('A ' + cfUpper(e.what) + ' APPEARS AT (' + e.x + ',' + e.y + ')');
        return true;
      case 'burn':
        cfFeed(e.n + ' ZOMBIE' + (e.n === 1 ? '' : 'S') + ' BURN UP AT DAWN');
        return true;
      case 'sleep':
        cfFeed(e.state === 'start' ? 'SEALED IN AND SLEEPING'
                                   : 'WOKE UP RESTED');
        return true;
      case 'starve':
        cfFeed('NO ' + cfUpper(e.which) + ' LEFT — ' + e.hp + ' HEALTH');
        return true;
      case 'budget':
        cfFeed('BUDGET GUARD — ' + e.remaining_s + 's left, scripted from here');
        return true;
      case 'turn':
        return true;      // the clock is that readout
    }
    return false;
  }

  function cfFrame(s, ctx, jumped) {
    if (ctx) CTX = ctx;
    if (jumped) {
      // A seek re-derives the beats, so the dedup map is reset — and the
      // buttons it produced are REMOVED first. Without that, every jump
      // appends another 31 markers to #scrub and a looping replay grows an
      // unbounded pile of absolutely-positioned buttons until the main thread
      // is doing nothing but layout.
      var scrub = cfEl('scrub');
      if (scrub) {
        var stale = scrub.querySelectorAll('button.beat-marker');
        for (var k = 0; k < stale.length; k++) {
          stale[k].parentNode.removeChild(stale[k]);
        }
      }
      cfPlaced = {};
      cfLit = {};
      cfPanX = -1;
      cfPanY = -1;
      cfZoomTries = 0;
    }
    var cf = s.cf;
    if (!cf) return;
    if (cf.camera) cfCameraCells = cf.camera;
    cfRenderVitals(cf);
    cfRenderInventory(cf);
    cfRenderChecklist(cf);
    cfRenderPlate(s, cf);
    cfRenderClock(s, cf);
    cfRenderAgentView(s, cf);
    cfRenderEndcard(s, cf);
    cfCamera(s, cf);
    // The up-front beat timeline (shipped ONCE by the load-time pre-scan)
    // places every marker before playback reaches it, so the scrubber draws
    // at FULL WIDTH on the first frame instead of growing in.
    if (s.beats && s.beats.length) {
      for (var i = 0; i < s.beats.length; i++) {
        var b = s.beats[i];
        switch (b.k) {
          case 'achievement':
            cfBeat(s, b.t, 'achievement', '★ Achievement ' + b.n + '/' + b.of +
              ' — ' + cfLabel(b.id) + ' — click to jump here');
            break;
          case 'nightfall':
            cfBeat(s, b.t, 'nightfall', 'Night falls on day ' + b.day +
              ' — click to jump here');
            break;
          case 'daybreak':
            cfBeat(s, b.t, 'daybreak', 'Day ' + b.day + ' breaks' +
              ' — click to jump here');
            break;
          case 'kill':
            cfBeat(s, b.t, 'kill', 'Killed a ' + b.what +
              ' — click to jump here');
            break;
          case 'death':
            cfBeat(s, b.t, 'death', (CF_DEATH[b.by] || 'Died') +
              ' — click to jump here');
            break;
          case 'fallback':
            cfBeat(s, b.t, 'fallback', 'Missed the call (' + b.cause +
              ') — click to jump here');
            break;
          case 'end':
            cfBeat(s, b.t, 'end', b.unlocked + ' of ' + b.of +
              ' unlocked — click to jump here');
            break;
        }
      }
    }
  }

  function cfDisarm() { cfFollow = false; }

  // A user pan or a minimap drag disarms the follow-cam; the starter's own
  // resetView() binding (dblclick / '0') re-arms it and restores
  // cameraCells = 15. The board's pointer surface is the one the starter
  // already wired, so this only listens.
  window.addEventListener('pointerdown', function (ev) {
    var board = cfEl('board');
    var mini = cfEl('minimap');
    if ((board && board.contains(ev.target)) ||
        (mini && mini.contains(ev.target))) {
      cfDisarm();
    }
  }, true);
  window.addEventListener('wheel', function () { cfDisarm(); }, true);

  window.PaintballChrome = {
    install: function (ctx) { CTX = ctx; },
    frame: cfFrame,
    event: cfEvent,
    armFollow: function () {
      cfFollow = true;
      cfCameraCells = 15;
      cfZoomApplied = false;
      cfZoomTries = 0;
    }
  };
})();
</script>

</body>
</html>
